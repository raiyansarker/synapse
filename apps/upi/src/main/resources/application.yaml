server:
  port: 8080

spring:
  application:
    name: upi
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  rabbitmq:
    # Full URI. amqps:// turns SSL on. Path after the host is the virtual host.
    addresses: ${SPRING_RABBITMQ_ADDRESSES}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Set true (e.g. bootRun --args='--upi.banks.seed=true') to insert demo banks.
upi:
  banks:
    seed: false

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.HikariConfig: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc: WARN
    org.postgresql: WARN
